name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        # Same as Dockerfile — npm ci can fail when lockfile drifts
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_ENV: production
          DATABASE_URL: postgresql://postgres:password@localhost:5432/scavenger_hunt?schema=public
          JWT_SECRET: ci-build-placeholder-secret-min-32-chars-long
          COOKIE_SECURE: "false"
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          REDIS_URL: redis://localhost:6379
          MQTT_URL: mqtt://localhost:1883
