services:
  postgres:
    image: postgres:16-alpine
    container_name: scavenger_hunt_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-scavenger_hunt}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-scavenger_hunt}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: scavenger_hunt_redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  emqx:
    image: emqx/emqx:5.8.3
    container_name: scavenger_hunt_emqx
    restart: unless-stopped
    ports:
      - "${MQTT_HOST_PORT:-1883}:1883"
      - "${MQTT_WS_HOST_PORT:-8083}:8083"
      - "${MQTT_DASHBOARD_PORT:-18083}:18083"
    environment:
      EMQX_ALLOW_ANONYMOUS: "${MQTT_ALLOW_ANONYMOUS:-true}"
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: scavenger-hunt:latest
    container_name: scavenger_hunt_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-scavenger_hunt}?schema=public
      REDIS_URL: redis://redis:6379
      MQTT_URL: mqtt://emqx:1883
      MQTT_PUBLIC_URL: ${MQTT_PUBLIC_URL:-mqtt://localhost:1883}
      MQTT_PUBLIC_WS_URL: ${MQTT_PUBLIC_WS_URL:-ws://localhost:8083/mqtt}
      RUN_DB_SEED: ${RUN_DB_SEED:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/firebase-service-account.json
    volumes:
      - uploads_data:/app/public/uploads
      - ./hunt-aa5e8-firebase-adminsdk-fbsvc-e3f5cbcdf5.json:/app/firebase-service-account.json:ro

  worker:
    image: scavenger-hunt:latest
    container_name: scavenger_hunt_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-scavenger_hunt}?schema=public
      REDIS_URL: redis://redis:6379
      MQTT_URL: mqtt://emqx:1883
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/firebase-service-account.json
    command: ["npx", "tsx", "scripts/hunt-start-worker.ts"]
    volumes:
      - ./hunt-aa5e8-firebase-adminsdk-fbsvc-e3f5cbcdf5.json:/app/firebase-service-account.json:ro

  mqtt-worker:
    image: scavenger-hunt:latest
    container_name: scavenger_hunt_mqtt_worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
      app:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-scavenger_hunt}?schema=public
      REDIS_URL: redis://redis:6379
      MQTT_URL: mqtt://emqx:1883
    command: ["npx", "tsx", "scripts/mqtt-live-worker.ts"]

volumes:
  postgres_data:
  redis_data:
  uploads_data:
